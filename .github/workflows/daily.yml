name: USA Client Hunter Daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install requests

      - name: Show files
        run: ls -la

      - name: Run USA Bot
        run: python USA_ENGLISH_ONLY_BOT.py

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: usa-leads
          path: "*.csv"
          if-no-files-found: warn
